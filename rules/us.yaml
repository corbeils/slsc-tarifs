        label: "Buses"
        rate: 10
        prefixes: ["8702"]
        status: to verify

  - id: US-232-METALS
    name: "Section 232 — steel, aluminum, copper and derivatives"
    family: s232
    prefixes: ["9903.78", "9903.80", "9903.81", "9903.82", "9903.83", "9903.85"]
    url: "https://www.federalregister.gov/documents/2026/04/09/2026-06960"
    status: verified
    note: >-
      Since Apr. 6, 2026 (Proclamation 11021): duty on the full customs value.
      50% primary metals (Annex I-A), 25% most derivatives (I-B).
      Since June 8, 2026 (through Dec. 31, 2027): temporary tiers (Annexes I-C and III).
    lowMetalExemptPct: 15          # < 15% covered metal by weight: not subject
    options:
      usMelt85:
        label: "≥ 85% of the metal melted/poured (smelted/cast) in the U.S. — total capped at 10%"
        capCombinedPct: 10
        status: verified
      annexIII:
        label: "Annex III (fixed industrial machinery, power, agricultural equipment, residential HVAC) — 15% total through Dec. 31, 2027"
        capCombinedPct: 15
        status: verified
      aluminumUnknown:
        label: "Aluminum: country of smelt/cast unknown, or aluminum smelted/cast in Russia — 200%"
        rate: 200
        status: verified
        note: "CBP charges the Russian aluminum rate (9903.85.67 / 9903.85.68) when the country of smelt or cast is reported as unknown (CSMS 65340246, since June 28, 2025)."
        warning: "Unknown country of smelt/cast: 200% Section 232 rate. Obtain the smelt and cast countries from the supplier (mill certificate / declaration) to pay the normal annex rate."
      steelUnknown:
        label: "Steel: country of melt & pour unknown"
        disables: [usMelt85]
        status: to verify
        note: "No punitive rate identified for steel, but the U.S.-metal (≥ 85%) reduction and other melt-based treatments cannot be claimed."
        warning: "Unknown country of melt & pour: the normal annex rate applies and the U.S.-metal reduction cannot be claimed. CBP still requires the melt & pour country on the entry."
      usmca232:
        label: "USMCA 232 treatment: 25% on non-U.S. content, 15% floor on total value (June 1, 2026 Proclamation)"
        nonUsContentRate: 25
        floorPct: 15
        status: to verify
        note: "Exact scope (Annex I-C vs. all derivatives) to be confirmed with CSMS/CBP — Oct. 2026 clarification on \"U.S. content\"."
    lists:
      - id: US-232-ANNEX-IA
        label: "Annex I-A — steel, aluminum and copper articles (50%)"
        rate: 50
        priority: 1
        prefixes: ["7206", "7207", "7208", "7209", "7210", "7211", "7212", "7213", "7214", "7215", "7216", "7217", "7218", "7219", "7220", "7221", "7222", "7223", "7224", "7225", "7226", "7227", "7228", "7229", "7301", "7302", "7304", "7305", "7306", "7601", "7604", "7605", "7606", "7607", "7608", "7609", "7407", "7408", "7409", "7410", "7411", "7412", "7413"]
        sources:
          - url: "https://www.whitehouse.gov/wp-content/uploads/2026/04/ANNEXES-I-A-I-B-II-III-IV.pdf"
            from: "Annex I-A: 50%"
            until: "Annex I-B: 25%"
        status: verified
        note: "Proclamation 11021 (Apr. 2, 2026), Annex I-A — imported automatically from the White House PDF."
      - id: US-232-ANNEX-IB
        label: "Annex I-B — steel, aluminum and copper derivatives (25%)"
        rate: 25
        priority: 1
        prefixes: ["7307", "7308", "7309", "7310", "7311", "7312", "7313", "7314", "7315", "7316", "7317", "7318", "7320", "7322", "7323", "7324", "7325", "7326", "7610", "7611", "7612", "7613", "7614", "7615", "7616"]
        sources:
          - url: "https://www.whitehouse.gov/wp-content/uploads/2026/04/ANNEXES-I-A-I-B-II-III-IV.pdf"
            from: "Annex I-B: 25%"
            until: "Annex II: Removed"
          - url: "https://www.whitehouse.gov/wp-content/uploads/2026/06/Annex-I-B.pdf"
        status: verified
        note: "Union of the April 2026 Annex I-B and the June 1, 2026 Annex I-B (Proclamation 11032). Goods moved to Annex I-C or III take their rate (higher priority)."
      - id: US-232-ANNEX-IC
        label: "Annex I-C — mobile industrial equipment and machinery (through Dec. 31, 2027)"
        rate: 25
        priority: 3
        sources:
          - url: "https://www.whitehouse.gov/wp-content/uploads/2026/06/Annex-I-C.pdf"
        status: verified
        note: "25% in general; 15% for framework economies; USMCA goods: 25% on non-U.S. content with a 15% floor (tick the USMCA 232 option); 10% for U.S. metal."
      - id: US-232-ANNEX-III
        label: "Annex III — fixed industrial machinery, power, agricultural equipment, residential HVAC (15% combined)"
        rate: 25
        capCombinedPct: 15
        priority: 3
        sources:
          - url: "https://www.whitehouse.gov/wp-content/uploads/2026/06/Annex-III.pdf"
        status: verified
        note: "Complete list as revised June 1, 2026 (Proclamation 11032), through Dec. 31, 2027."
      - id: US-232-ANNEX-II
        label: "Annex II — removed from the scope of the steel and aluminum derivatives"
        rate: 0
        exclusion: true
        sources:
          - url: "https://www.whitehouse.gov/wp-content/uploads/2026/04/ANNEXES-I-A-I-B-II-III-IV.pdf"
            from: "Annex II: Removed"
            until: "Annex III: Temporary"
        status: verified

