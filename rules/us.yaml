# =====================================================================
#  RULES — INBOUND USA (imports into the United States)
#  Reference date: November 23, 2026
#  status: "verified"  = confirmed in an official or reputable law-firm source
#          "to verify" = plausible parameter, to be confirmed (CSMS / Federal Register)
#  Chapter 99 heading rates are read AUTOMATICALLY from the USITC export
#  ("General" column: "The duty provided in the applicable subheading + X%").
#  This file only defines how they combine, who they apply to, and which
#  exemptions exist.
# =====================================================================

currency: USD

fees:
  mpf:
    label: "Merchandise Processing Fee (MPF)"
    pct: 0.3464
    min: 34.58          # FY2027, effective Oct. 1, 2026
    max: 670.86
    formalThreshold: 2500
    informalFlat: 2.77
    # No MPF on USMCA-originating goods from Canada or Mexico
    exemptPreferentialOrigins: [CA, MX]
    legal: "19 CFR 24.23; CBP FY2027 notice (FR 2026-15530)"
    status: verified
  hmf:
    label: "Harbor Maintenance Fee (HMF) — ocean only"
    pct: 0.125
    modes: [ocean]
    legal: "19 CFR 24.24"
    status: verified

# Countries subject to Column 2 ("Other" rate) instead of Column 1
column2Countries: [CU, KP, RU, BY]

# "Special" column indicators available by origin (agreements in force)
preferentialPrograms:
  CA: [S, S+]
  MX: [S, S+]
  AU: [AU]
  BH: [BH]
  CL: [CL]
  CO: [CO]
  IL: [IL]
  JO: [JO]
  JP: [JP]
  KR: [KR]
  MA: [MA]
  OM: [OM]
  PA: [PA]
  PE: [PE]
  SG: [SG]
  CR: [P, P+]
  DO: [P, P+]
  SV: [P, P+]
  GT: [P, P+]
  HN: [P, P+]
  NI: [P, P+]

