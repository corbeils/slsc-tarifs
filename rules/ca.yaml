# =====================================================================
#  RÈGLES — IMPORTATION AU CANADA (US → CA ou autre origine → CA)
#  Mise à jour de référence : 23 novembre 2026
#  Les taux NPF / TÉU (UST) proviennent du fichier du Tarif des douanes (CBSA).
#  Les surtaxes sont définies par DÉCRETS avec des listes de numéros tarifaires :
#  importer chaque liste via Admin → Listes de codes (copier-coller de l'annexe
#  du décret, de l'avis des douanes ou de la page des Finances).
#  Les « prefixes » ci-dessous ne sont qu'un amorçage indicatif.
# =====================================================================

currency: CAD

taxes:
  gst:
    label: "TPS"
    pct: 5
    status: vérifié
  # TVH perçue à la frontière pour les provinces participantes (partie provinciale incluse)
  hst:
    ON: 13
    NB: 15
    NL: 15
    NS: 14
    PE: 15
  note: "Québec : la TVQ n'est pas perçue par l'ASFC (autocotisation / remboursement)."

# Traitement tarifaire préférentiel selon l'origine (si réclamé et preuve d'origine valide)
preferential:
  US: [UST]
  MX: [MXT, CPTPT]
  CL: [CT, CPTPT]
  PE: [PT, CPTPT]
  CO: [COLT]
  CR: [CRT]
  IL: [CIAT]
  JO: [JT]
  PA: [PAT]
  HN: [HNT]
  KR: [KRT]
  UA: [UAT]
  GB: [UKT, CPUKT]
  NO: [NT]
  IS: [IT]
  CH: [SLT]
  LI: [SLT]
  AU: [CPTPT]
  BN: [CPTPT]
  JP: [CPTPT]
  MY: [CPTPT]
  NZ: [CPTPT]
  SG: [CPTPT]
  VN: [CPTPT]
  EU: [CEUT]

# Partenaires ALE hors ACEUM (contingents acier à 75 % des volumes 2024 ; non-ALE : 20 %)
ftaPartners: [EU, GB, CH, NO, IS, LI, CL, CO, CR, HN, IL, JO, KR, PA, PE, UA, AU, BN, JP, MY, NZ, SG, VN]

measures:
  # --------------------------- Contre-mesures visant les É.-U. ---------------------------
  - id: CA-US-SA
    name: "Surtaxe É.-U. — acier et aluminium"
    program: "Contre-mesures canadiennes"
    legal: "DORS/2025-95, modifié par DORS/2026-187 (50 % dès le 8 sept. 2026)"
    url: "https://www.cbsa-asfc.gc.ca/publications/cn-ad/menu-eng.html"
    rate: 50
    origins: [US]
    from: "2025-03-13"
    scope:
      codeList: true
      prefixes: ["7206", "7207", "7208", "7209", "7210", "7211", "7212", "7213", "7214", "7215", "7216", "7217", "7218", "7219", "7220", "7221", "7222", "7223", "7224", "7225", "7226", "7227", "7228", "7229", "7301", "7302", "7303", "7304", "7305", "7306", "7601", "7604", "7605", "7606", "7607", "7608", "7609"]
    group: ca-steel
    priority: 10
    status: vérifié
    note: "50 % pour la majorité des biens ; certains demeurent à 25 % — importer les listes par taux. Aucune exemption ACEUM."
    exemptIf:
      - { option: usSurtaxRemission, label: "Remise horizontale — Décret de remise des surtaxes (É.-U.) 2025 (fabrication, transformation, emballage alimentaire, santé, sécurité publique) — jusqu'au 30 juin 2027" }

  - id: CA-US-AUTO
    name: "Surtaxe É.-U. — véhicules automobiles"
    program: "Contre-mesures canadiennes"
    legal: "Décret de surtaxe (véhicules automobiles 2025) ; remise : TR/2026-13"
    rate: 25
    origins: [US]
    from: "2025-04-09"
    scope:
      codeList: true
      prefixes: ["8703.21", "8703.22", "8703.23", "8703.24", "8703.31", "8703.32", "8703.33", "8703.40", "8703.50", "8703.60", "8703.70", "8703.80", "8703.90", "8704.21", "8704.31", "8704.41", "8704.51"]
      exclude: ["8704.60.00"]
    preferentialBasis: nonCaMxContent
    status: vérifié
    note: "Véhicules ACEUM : surtaxe sur le contenu non canadien et non mexicain. Exclus : 8704.60.00 et véhicules de plus de 25 ans."
    exemptIf:
      - { option: autoRemission, label: "Cadre de remise automobile (constructeurs admissibles, quota) — jusqu'au 8 avr. 2027" }
      - { option: vehicleOver25, label: "Véhicule fabriqué il y a plus de 25 ans" }

  - id: CA-US-2025-1
    name: "Surtaxe É.-U. 2025-1 (25 %) — biens non originaires ACEUM"
    program: "Contre-mesures canadiennes"
    legal: "Décret de surtaxe (2025-1) ; levée pour les biens ACEUM depuis le 1er sept. 2025"
    rate: 25
    origins: [US]
    scope: { codeList: true }
    status: vérifié
    note: "Ne s'applique plus aux biens originaires ACEUM ; importer la liste du décret."
    exemptIf:
      - { preferential: true, label: "Bien originaire ACEUM (traitement TÉU réclamé)" }
      - { option: usSurtaxRemission, label: "Remise horizontale 2025 (jusqu'au 30 juin 2027)" }

  - id: CA-US-2026-15
    name: "Surtaxe É.-U. 2026 — 15 %"
    program: "Contre-mesures canadiennes"
    legal: "Décret de surtaxe des États-Unis (2026), DORS/2026-186 ; Avis des douanes 26-23"
    rate: 15
    origins: [US]
    from: "2026-09-08"
    scope: { codeList: true }
    status: vérifié
    note: "Aucune exemption ACEUM. Importer la liste « 15 % »."
    exemptIf:
      - { option: usSurtaxRemission, label: "Remise horizontale 2025 (jusqu'au 30 juin 2027)" }

  - id: CA-US-2026-25
    name: "Surtaxe É.-U. 2026 — 25 %"
    program: "Contre-mesures canadiennes"
    legal: "DORS/2026-186 ; Avis des douanes 26-23"
    rate: 25
    origins: [US]
    from: "2026-09-08"
    scope: { codeList: true }
    status: vérifié
    note: "Ex. : électroménagers, produits laitiers, poissons, bois/contreplaqué, articles ménagers acier/alu. Importer la liste « 25 % »."
    exemptIf:
      - { option: usSurtaxRemission, label: "Remise horizontale 2025 (jusqu'au 30 juin 2027)" }

  - id: CA-US-2026-50
    name: "Surtaxe É.-U. 2026 — 50 %"
    program: "Contre-mesures canadiennes"
    legal: "DORS/2026-186 ; Avis des douanes 26-23"
    rate: 50
    origins: [US]
    from: "2026-09-08"
    scope: { codeList: true }
    status: vérifié
    note: "Ex. : certains aciers/alu, meubles, vêtements, équipement sportif. Importer la liste « 50 % »."
    exemptIf:
      - { option: usSurtaxRemission, label: "Remise horizontale 2025 (jusqu'au 30 juin 2027)" }

  # --------------------------- Mesures visant la Chine ---------------------------
  - id: CA-CN-EV
    name: "Surtaxe Chine — véhicules électriques (100 %)"
    program: "Surtaxe Chine"
    legal: "Décret de surtaxe (Chine) 2024 ; contingent VE chinois (1er mars 2026)"
    rate: 100
    origins: [CN]
    scope:
      codeList: true
      prefixes: ["8703.40", "8703.60", "8703.70", "8703.80", "8702.20", "8702.30", "8702.40"]
    status: à valider
    note: "Contingent annuel de 49 000 VE chinois au taux NPF (6,1 %) sous permis d'importation."
    exemptIf:
      - { option: chinaEvQuota, label: "Dans le contingent VE chinois (permis d'importation requis)" }

  - id: CA-CN-SA
    name: "Surtaxe Chine — acier et aluminium (25 %)"
    program: "Surtaxe Chine"
    legal: "Décret de surtaxe (Chine) 2024, en vigueur le 22 oct. 2024"
    rate: 25
    origins: [CN]
    scope:
      codeList: true
      prefixes: ["7206", "7207", "7208", "7209", "7210", "7211", "7212", "7213", "7214", "7215", "7216", "7217", "7218", "7219", "7220", "7221", "7222", "7223", "7224", "7225", "7226", "7227", "7228", "7229", "7301", "7302", "7303", "7304", "7305", "7306", "7601", "7604", "7605", "7606", "7607", "7608", "7609"]
    group: ca-steel
    priority: 5
    status: vérifié
    note: "Acier chinois aussi visé par le contingent : 25 % dans le contingent, 50 % hors contingent (non cumulatif)."

  # --------------------------- Mesures acier globales ---------------------------
  - id: CA-STEEL-TRQ
    name: "Contingent tarifaire acier — surtaxe hors contingent (50 %)"
    program: "Mesures de protection de l'acier"
    legal: "DORS/2025-148, modifié par DORS/2026-119 (prolongé au 27 juin 2027)"
    url: "https://www.international.gc.ca/trade-commerce/controls-controles/notices-avis/1163.aspx?lang=eng"
    rate: 50
    excludeOrigins: [US, MX, CA]
    requiresOption: overQuota
    scope:
      codeList: true
      prefixes: ["7206", "7207", "7208", "7209", "7210", "7211", "7212", "7213", "7214", "7215", "7216", "7217", "7218", "7219", "7220", "7221", "7222", "7223", "7224", "7225", "7226", "7227", "7228", "7229", "7301", "7302", "7303", "7304", "7305", "7306"]
    group: ca-steel
    priority: 20
    status: vérifié
    note: "Contingents trimestriels : 20 % des volumes 2024 (non-ALE) / 75 % (ALE hors ACEUM). Permis d'importation par expédition (LMIC art. 82)."

  - id: CA-STEEL-DERIV
    name: "Surtaxe mondiale — dérivés de l'acier (25 %)"
    program: "Mesures de protection de l'acier"
    legal: "Décret de surtaxe sur les marchandises dérivées de l'acier, DORS/2025-267 (26 déc. 2025) ; Avis 25-33"
    rate: 25
    scope:
      codeList: true
    group: ca-steel
    priority: 1
    status: vérifié
    note: "Biens d'origine É.-U. déjà visés par la surtaxe É.-U. : seule la surtaxe É.-U. s'applique."
    exemptIf:
      - { families: [CA-US-SA], label: "Bien américain déjà visé par la surtaxe É.-U. acier/alu" }
      - { option: derivRelief, label: "Allègement — fabrication de véhicules automobiles, aérospatiale et pièces (jusqu'au 30 juin 2027)" }

  - id: CA-CN-MELT
    name: "Surtaxe — acier fondu et coulé en Chine (25 %)"
    program: "Mesures de protection de l'acier"
    legal: "Décret de surtaxe (marchandises d'acier et d'aluminium), DORS/2025-154"
    rate: 25
    excludeOrigins: [US, CA]
    requiresOption: chinaMeltedSteel
    scope:
      codeList: true
      prefixes: ["7206", "7207", "7208", "7209", "7210", "7211", "7212", "7213", "7214", "7215", "7216", "7217", "7218", "7219", "7220", "7221", "7222", "7223", "7224", "7225", "7226", "7227", "7228", "7229", "7301", "7302", "7303", "7304", "7305", "7306"]
    group: ca-steel
    priority: 3
    status: vérifié

regimes:
  - id: none
    label: "Importation ordinaire"
  - id: ca-goods-returned
    code: "9971.00.00"
    label: "Marchandises canadiennes retournées (sans amélioration)"
    effect: { baseFree: true, skipAdditional: true }
    status: vérifié
    note: "Biens produits au Canada, réimportés sans avoir été améliorés ni transformés."
  - id: repair-cusma
    code: "9992.00.00"
    label: "Retour après réparation/modification aux É.-U. ou au Mexique"
    effect: { baseFree: true, skipAdditional: true, gstOnRepairValue: true }
    status: vérifié
    note: "Franchise de droits ; TPS sur la valeur de la réparation."
  - id: temporary
    code: "9993.00.00"
    label: "Importation temporaire (E29B) — réexportation prévue"
    effect: { deferred: true }
    status: vérifié
    note: "Exonération totale ou partielle selon le Règlement (Mémorandum D8-1-1) ; garantie possible."
  - id: drp
    label: "Programme d'exonération des droits / drawback (réexportation)"
    effect: { infoOnly: true }
    status: vérifié
    note: "Droits et surtaxes exonérés ou remboursés si la marchandise (ou le produit transformé) est exportée (Mémorandums D7-4-1, D7-4-2)."
