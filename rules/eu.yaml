  JP: { name: "EU-Japan Economic Partnership Agreement", short: "EU-Japan EPA", url: "https://trade.ec.europa.eu/access-to-markets/en/content/free-trade-agreements" }
  KR: { name: "EU-South Korea Free Trade Agreement", short: "EU-Korea FTA", url: "https://trade.ec.europa.eu/access-to-markets/en/content/free-trade-agreements" }
  GB: { name: "EU-UK Trade and Cooperation Agreement", short: "TCA", url: "https://trade.ec.europa.eu/access-to-markets/en/content/free-trade-agreements" }
  CH: { name: "EU-Switzerland Free Trade Agreement", short: "EU-Switzerland", url: "https://trade.ec.europa.eu/access-to-markets/en/content/free-trade-agreements" }
  NO: { name: "European Economic Area (EEA)", short: "EEA", url: "https://policy.trade.ec.europa.eu/eu-trade-relationships-country-and-region/negotiations-and-agreements_en" }
  IS: { name: "European Economic Area (EEA)", short: "EEA", url: "https://policy.trade.ec.europa.eu/eu-trade-relationships-country-and-region/negotiations-and-agreements_en" }
  LI: { name: "European Economic Area (EEA)", short: "EEA", url: "https://policy.trade.ec.europa.eu/eu-trade-relationships-country-and-region/negotiations-and-agreements_en" }
  SG: { name: "EU-Singapore Free Trade Agreement", short: "EUSFTA", url: "https://trade.ec.europa.eu/access-to-markets/en/content/free-trade-agreements" }
