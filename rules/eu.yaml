# =====================================================================
#  RULES — INBOUND EU (imports into the European Union)
#  Reference date: November 24, 2026
#  Duties, preferences, quotas, anti-dumping/countervailing and additional
#  duties come from TARIC (imported in Admin). This file holds what TARIC
#  does not contain: national VAT rates and the names/links of the agreements.
# =====================================================================

currency: EUR

# Standard import VAT rate by member state (%). Reduced rates exist for some goods (food, books, medicines…).
vat:
  AT: 20
  BE: 21
  BG: 20
  HR: 25
  CY: 19
  CZ: 21
  DK: 25
  EE: 24
  FI: 25.5
  FR: 20
  DE: 19
  GR: 24
  HU: 27
  IE: 23
  IT: 22
  LV: 21
  LT: 21
  LU: 17
  MT: 18
  NL: 21
  PL: 23
  PT: 23
  RO: 21
  SK: 23
  SI: 22
  ES: 21
  SE: 25
vatNote: "Import VAT base: customs value (CIF) + customs duties + other charges + transport costs to the first destination in the EU. Standard rate shown; check reduced rates for the goods."

# TARIC measure types (code → how the simulator uses it)
measureTypes:
  thirdCountry: ["103"]
  endUse: ["105"]
  suspension: ["112"]
  endUseSuspension: ["115", "117", "119"]
  customsUnion: ["106"]
  preference: ["141", "142", "145"]
  preferentialQuota: ["143", "146"]
  quota: ["122", "123", "147"]
  antiDumping: ["551", "552", "553", "554", "555", "562", "564"]
  additional: ["690", "692", "693", "695", "696"]
  agricultural: ["672", "673", "674"]

# Out-of-quota duties (steel): measures whose legal base matches are additional duties (whatever their TARIC type,
# except quota types) and are not due when the matching tariff quota is ticked.
# Regulation (EU) 2026/1384 (steel overcapacity, from July 1, 2026, 50%), bilateral safeguards (EU) 2026/1930,
# former safeguard (EU) 2019/159 (until June 30, 2026).
outOfQuota:
  legal: ["2601384", "2026/1384", "2601930", "2026/1930", "1900159", "2019/159"]
  label: "Steel out-of-quota duty — Regulation (EU) 2026/1384"
  note: "Due only when the country's tariff quota is exhausted (or for imports without quota). Tick the tariff quota below if a balance is available. Melt and pour country required since Oct. 1, 2026."

# Free trade agreements by TARIC origin (country or group code). Origins not listed use the TARIC description.
agreements:
