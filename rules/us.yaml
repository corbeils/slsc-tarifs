# ---------------------------------------------------------------------
# MEASURES APPLIED BY COUNTRY OF ORIGIN (not tied to HTS lines)
# ---------------------------------------------------------------------
measures:
  - id: US-301-FL
    name: "Section 301 — forced labor (60 economies)"
    program: "Section 301"
    legal: "USTR, 91 FR 47318 (July 23, 2026) — Chapter 99 note 52"
    url: "https://ustr.gov"
    status: verified
    from: "2026-07-24"
    scope: { all: true }
    # Country headings detected automatically in 9903.05.20 to 9903.05.84 once the USITC export is imported.
    autoFromCh99Range: ["9903.05.20", "9903.05.84"]
    # Fallback values if Chapter 99 has not been imported yet:
    originRates:
      CA: 10
      MX: 10
      CN: 12.5
      AR: 10
      BD: 10
      KH: 10
      EC: 10
      SV: 10
      GT: 10
      HN: 10
      IN: 10
      ID: 10
      JO: 10
      MY: 10
      PK: 10
      LK: 10
      TT: 10
      GB: 10
      EU: 10
      TW: 10
      JP: 12.5
      KR: 12.5
      CH: 12.5
    originCh99:
      CA: "9903.05.29"
      MX: "9903.05.55"
      CN: "9903.05.31"
    # Combined MFN + 301 cap ("net of MFN")
    originCaps:
      EU: 10
      TW: 10
      JP: 12.5
      KR: 12.5
      CH: 12.5
    exemptIf:
      - { preferentialDutyFree: true, origins: [CA], ch99: "9903.05.93", label: "Product of Canada entered duty-free under USMCA" }
      - { preferentialDutyFree: true, origins: [MX], ch99: "9903.05.94", label: "Product of Mexico entered duty-free under USMCA" }
      - { families: [s232], ch99: "9903.05.90", label: "Article subject to a Section 232 program (steel/aluminum/copper, autos, trucks, wood, semiconductors)" }
      - { refs: ["9903.05.86"], ch99: "9903.05.86", label: "Product on the exemption list (food, energy, metals, high-tech)" }
      - { option: civilAircraft, ch99: "9903.05.88", label: "Civil aircraft, engines, parts" }
      - { option: humanitarian, ch99: "9903.05.91", label: "Humanitarian donations (food, clothing, medicine)" }
    note: "Full list of the 60 economies: headings 9903.05.20 to 9903.05.84 (imported automatically)."

