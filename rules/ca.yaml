# =====================================================================
#  RULES — INBOUND CANADA (imports into Canada)
#  Reference date: November 23, 2026
#  MFN / UST rates come from the CBSA Customs Tariff file.
#  Surtaxes are defined by ORDERS with lists of tariff items: import each
#  list via Admin → Code lists (paste the order's schedule, the customs
#  notice or the Finance Canada page).
#  The "prefixes" below are only an indicative starting point.
# =====================================================================

currency: CAD

taxes:
  gst:
    label: "GST"
    pct: 5
    status: verified
  # HST collected at the border for participating provinces (provincial part included)
  hst:
    ON: 13
    NB: 15
    NL: 15
    NS: 14
    PE: 15
  note: "Quebec: QST is not collected by the CBSA (self-assessment / rebate)."

# Preferential tariff treatment by origin (if claimed with valid proof of origin)
preferential:
  US: [UST]
  MX: [MXT, CPTPT]
  CL: [CT, CPTPT]
  PE: [PT, CPTPT]
  CO: [COLT]
  CR: [CRT]
  IL: [CIAT]
  JO: [JT]
  PA: [PAT]
  HN: [HNT]
  KR: [KRT]
  UA: [UAT]
  GB: [UKT, CPUKT]
  NO: [NT]
  IS: [IT]
  CH: [SLT]
  LI: [SLT]
  AU: [CPTPT]
  BN: [CPTPT]
  JP: [CPTPT]
  MY: [CPTPT]
  NZ: [CPTPT]
  SG: [CPTPT]
  VN: [CPTPT]
  EU: [CEUT]

# Tariff treatments of the Customs Tariff (s. 27) — shown for every tariff item that has a rate for them.
# countries = who can claim; no countries = beneficiary list to check (List of countries and applicable tariff treatments).
agreements:
  UST:   { name: "United States Tariff (CUSMA)", short: "CUSMA", countries: [US], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11/d11-5-17-eng.html" }
  MXT:   { name: "Mexico Tariff (CUSMA)", short: "CUSMA", countries: [MX], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11/d11-5-17-eng.html" }
  MUST:  { name: "Mexico-United States Tariff (CUSMA)", short: "CUSMA", countries: [MX, US], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11/d11-5-17-eng.html" }
  CEUT:  { name: "Canada-European Union Tariff (CETA)", short: "CETA", countries: [EU], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  UKT:   { name: "United Kingdom Tariff (Canada-UK Trade Continuity Agreement)", short: "CUKTCA", countries: [GB], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  CPTPT: { name: "Comprehensive and Progressive Trans-Pacific Partnership Tariff", short: "CPTPP", countries: [AU, BN, CL, JP, MY, MX, NZ, PE, SG, VN, GB], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  CIAT:  { name: "Canada-Israel Agreement Tariff", short: "CIFTA", countries: [IL], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  CT:    { name: "Chile Tariff", short: "CCFTA", countries: [CL], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  CRT:   { name: "Costa Rica Tariff", short: "CCRFTA", countries: [CR], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  COLT:  { name: "Colombia Tariff", short: "CCOFTA", countries: [CO], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  PT:    { name: "Peru Tariff", short: "CPFTA", countries: [PE], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  PAT:   { name: "Panama Tariff", short: "CPAFTA", countries: [PA], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  HNT:   { name: "Honduras Tariff", short: "CHFTA", countries: [HN], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  JT:    { name: "Jordan Tariff", short: "CJFTA", countries: [JO], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  KRT:   { name: "Korea Tariff", short: "CKFTA", countries: [KR], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  UAT:   { name: "Ukraine Tariff", short: "CUFTA", countries: [UA], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  IT:    { name: "Iceland Tariff (Canada-EFTA)", short: "CEFTA", countries: [IS], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  NT:    { name: "Norway Tariff (Canada-EFTA)", short: "CEFTA", countries: [NO], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  SLT:   { name: "Switzerland-Liechtenstein Tariff (Canada-EFTA)", short: "CEFTA", countries: [CH, LI], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  AUT:   { name: "Australia Tariff", short: "AUT", countries: [AU], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  NZT:   { name: "New Zealand Tariff", short: "NZT", countries: [NZ], url: "https://www.cbsa-asfc.gc.ca/publications/dm-md/d11-eng.html" }
  CCCT:  { name: "Commonwealth Caribbean Countries Tariff", short: "CCCT", candidates: [AI, AG, BS, BB, BZ, BM, VG, KY, DM, GD, GY, JM, MS, KN, LC, VC, TT, TC], note: "Commonwealth Caribbean beneficiary countries.", url: "https://www.cbsa-asfc.gc.ca/trade-commerce/tariff-tarif/2026/html/countries-pays-eng.html" }
  GPT:   { name: "General Preferential Tariff", short: "GPT", excludeOrigins: [US, MX, EU, GB, JP, KR, AU, NZ, CH, LI, NO, IS, IL, SG, CN, HK, TW, CL, CO, PE, PA, CR, HN, JO, UA, RU, BY, KP, CU], note: "Developing beneficiary countries — see the CBSA list of countries and applicable tariff treatments.", url: "https://www.cbsa-asfc.gc.ca/trade-commerce/tariff-tarif/2026/html/countries-pays-eng.html" }
  LDCT:  { name: "Least Developed Country Tariff", short: "LDCT", excludeOrigins: [US, MX, EU, GB, JP, KR, AU, NZ, CH, LI, NO, IS, IL, SG, CN, HK, TW, CL, CO, PE, PA, CR, HN, JO, UA, RU, BY, KP, CU], note: "Least developed beneficiary countries — see the CBSA list of countries and applicable tariff treatments.", url: "https://www.cbsa-asfc.gc.ca/trade-commerce/tariff-tarif/2026/html/countries-pays-eng.html" }

# Non-CUSMA FTA partners (steel TRQ at 75% of 2024 volumes; non-FTA: 20%)
ftaPartners: [EU, GB, CH, NO, IS, LI, CL, CO, CR, HN, IL, JO, KR, PA, PE, UA, AU, BN, JP, MY, NZ, SG, VN]

measures:
  # --------------------------- Countermeasures against the U.S. ---------------------------
  - id: CA-US-SURTAX
    name: "U.S. surtax — Canadian countermeasures (steel, aluminum and Sept. 8, 2026 list)"
    program: "Canadian countermeasures"
    legal: "United States Surtax Order (Steel and Aluminum 2025), SOR/2025-95 as amended by SOR/2026-187; United States Surtax Order (2026), SOR/2026-186; Customs Notices 25-11 and 26-23"
    url: "https://www.canada.ca/en/department-finance/programs/international-trade-finance-policy/canadas-response-us-tariffs/complete-list-us-products-subject-to-counter-tariffs.html"
    rate: 50
    origins: [US]
    scope:
      codeList: true
      prefixes: ["7206", "7207", "7208", "7209", "7210", "7211", "7212", "7213", "7214", "7215", "7216", "7217", "7218", "7219", "7220", "7221", "7222", "7223", "7224", "7225", "7226", "7227", "7228", "7229", "7301", "7302", "7303", "7304", "7305", "7306", "7601", "7604", "7605", "7606", "7607", "7608", "7609"]
    sources:
      - url: "https://www.canada.ca/en/department-finance/programs/international-trade-finance-policy/canadas-response-us-tariffs/complete-list-us-products-subject-to-counter-tariffs.html"
        rates: stream
    group: ca-us
    priority: 10
    status: verified
    note: "Rate per tariff item (15%, 25% or 50%) read from the Department of Finance consolidated list, imported automatically. No CUSMA exemption. Until the list is imported, steel/aluminum prefixes are used at 50%."
    exemptIf:
      - { option: usSurtaxRemission, label: "Horizontal remission — United States Surtax Remission Order (2025) (manufacturing, processing, food packaging, health, public safety) — until June 30, 2027" }

  - id: CA-US-AUTO
    name: "U.S. surtax — motor vehicles"
    program: "Canadian countermeasures"
    legal: "United States Surtax Order (Motor Vehicles 2025); remission: SI/2026-13"
    rate: 25
    origins: [US]
    from: "2025-04-09"
    scope:
      codeList: true
      prefixes: ["8703.21", "8703.22", "8703.23", "8703.24", "8703.31", "8703.32", "8703.33", "8703.40", "8703.50", "8703.60", "8703.70", "8703.80", "8703.90", "8704.21", "8704.31", "8704.41", "8704.51"]
      exclude: ["8704.60.00"]
    preferentialBasis: nonCaMxContent
    group: ca-us
    status: verified
    note: "CUSMA vehicles: surtax on non-Canadian, non-Mexican content. Excluded: 8704.60.00 and vehicles over 25 years old."
    exemptIf:
      - { option: autoRemission, label: "Automotive remission framework (eligible automakers, quota) — until Apr. 8, 2027" }
      - { option: vehicleOver25, label: "Vehicle manufactured more than 25 years ago" }

  # --------------------------- Measures against China ---------------------------
  - id: CA-CN-EV
    name: "China surtax — electric vehicles (100%)"
    program: "China surtax"
    legal: "China Surtax Order (2024); Chinese EV quota (March 1, 2026)"
    rate: 100
    origins: [CN]
    scope:
      codeList: true
      prefixes: ["8703.40", "8703.60", "8703.70", "8703.80", "8702.20", "8702.30", "8702.40"]
    status: to verify
    note: "Annual quota of 49,000 Chinese EVs at the MFN rate (6.1%) under import permit."
    exemptIf:
      - { option: chinaEvQuota, label: "Within the Chinese EV quota (import permit required)" }

  - id: CA-CN-SA
    name: "China surtax — steel and aluminum (25%)"
    program: "China surtax"
    legal: "China Surtax Order (2024), in force Oct. 22, 2024"
    rate: 25
    origins: [CN]
    scope:
      codeList: true
      prefixes: ["7206", "7207", "7208", "7209", "7210", "7211", "7212", "7213", "7214", "7215", "7216", "7217", "7218", "7219", "7220", "7221", "7222", "7223", "7224", "7225", "7226", "7227", "7228", "7229", "7301", "7302", "7303", "7304", "7305", "7306", "7601", "7604", "7605", "7606", "7607", "7608", "7609"]
    group: ca-steel
    priority: 5
    status: verified
    note: "Chinese steel also under the TRQ: 25% within quota, 50% over quota (not cumulative)."

  # --------------------------- Global steel measures ---------------------------
  - id: CA-STEEL-TRQ
    name: "Steel tariff rate quota — over-quota surtax (50%)"
    program: "Steel protection measures"
    legal: "SOR/2025-148, as amended by SOR/2026-119 (extended to June 27, 2027)"
    url: "https://www.international.gc.ca/trade-commerce/controls-controles/notices-avis/1163.aspx?lang=eng"
    rate: 50
    excludeOrigins: [US, MX, CA]
    requiresOption: overQuota
    scope:
      codeList: true
      prefixes: ["7206", "7207", "7208", "7209", "7210", "7211", "7212", "7213", "7214", "7215", "7216", "7217", "7218", "7219", "7220", "7221", "7222", "7223", "7224", "7225", "7226", "7227", "7228", "7229", "7301", "7302", "7303", "7304", "7305", "7306"]
    group: ca-steel
    priority: 20
    status: verified
    note: "Quarterly quotas: 20% of 2024 volumes (non-FTA) / 75% (non-CUSMA FTA). Shipment-specific import permit (ICL item 82)."

  - id: CA-STEEL-DERIV
    name: "Global surtax — steel derivative goods (25%)"
    program: "Steel protection measures"
    legal: "Steel Derivative Goods Surtax Order, SOR/2025-267 (Dec. 26, 2025); Customs Notice 25-33"
    rate: 25
    scope:
      codeList: true
    group: ca-steel
    priority: 1
    status: verified
    note: "U.S.-origin goods already subject to the U.S. surtax: only the U.S. surtax applies."
    exemptIf:
      - { families: [CA-US-SURTAX], label: "U.S. good already subject to the U.S. surtax (only the U.S. surtax applies)" }
      - { option: derivRelief, label: "Relief — manufacturing of motor vehicles, aerospace goods and parts (until June 30, 2027)" }

  - id: CA-CN-MELT
    name: "Surtax — steel melted and poured in China (25%)"
    program: "Steel protection measures"
    legal: "Steel Goods and Aluminum Goods Surtax Order, SOR/2025-154"
    rate: 25
    excludeOrigins: [US, CA]
    requiresOption: chinaMeltedSteel
    scope:
      codeList: true
      prefixes: ["7206", "7207", "7208", "7209", "7210", "7211", "7212", "7213", "7214", "7215", "7216", "7217", "7218", "7219", "7220", "7221", "7222", "7223", "7224", "7225", "7226", "7227", "7228", "7229", "7301", "7302", "7303", "7304", "7305", "7306"]
    group: ca-steel
    priority: 3
    status: verified

regimes:
  - id: none
    label: "Ordinary import"
  - id: ca-goods-returned
    code: "9971.00.00"
    label: "Canadian goods returned (not advanced in value)"
    effect: { baseFree: true, skipAdditional: true }
    status: verified
    note: "Goods produced in Canada, re-imported without having been improved or processed."
  - id: repair-cusma
    code: "9992.00.00"
    label: "Returned after repair/alteration in the U.S. or Mexico"
    effect: { baseFree: true, skipAdditional: true, gstOnRepairValue: true }
    status: verified
    note: "Duty-free; GST on the repair value."
  - id: temporary
    code: "9993.00.00"
    label: "Temporary importation (E29B) — re-export planned"
    effect: { deferred: true }
    status: verified
    note: "Full or partial relief under the Regulations (Memorandum D8-1-1); security may be required."
  - id: drp
    label: "Duties Relief Program / drawback (re-export)"
    effect: { infoOnly: true }
    status: verified
    note: "Duties and surtaxes relieved or refunded if the goods (or the processed product) are exported (Memoranda D7-4-1, D7-4-2)."
