# ---------------------------------------------------------------------
# CHAPTER 99 PROGRAMS (detected from the HTS line's references/footnotes)
# Order = evaluation priority.
# ---------------------------------------------------------------------
programs:
  - id: US-232-AUTO
    name: "Section 232 — automobiles and auto parts"
    family: s232
    prefixes: ["9903.94"]
    url: "https://www.cbp.gov/trade/programs-administration/entry-summary/232-tariffs-aluminum-and-steel-faqs"
    status: verified
    preferential:
      # USMCA vehicles: 25% on non-U.S. content; USMCA-qualifying parts: exempt
      mode: nonUsContent
      partsExemptOption: usmcaAutoPart
    note: "Only one Section 232 program per article: autos take priority over metals."
    lists:
      - id: US-232-AUTO-VEH
        label: "Passenger vehicles and light trucks"
        rate: 25
        ch99: "9903.94.01"
        prefixes: ["8703.21", "8703.22", "8703.23", "8703.24", "8703.31", "8703.32", "8703.33", "8703.40", "8703.50", "8703.60", "8703.70", "8703.80", "8703.90", "8704.21", "8704.31", "8704.41", "8704.51"]
        status: verified
      - id: US-232-AUTO-PARTS
        label: "Automobile parts (Annex I parts list)"
        rate: 25
        ch99: "9903.94.05"
        prefixes: ["8706", "8707", "8708", "8407.31", "8407.32", "8407.33", "8407.34", "8408.20", "4011.10", "4011.20", "8544.30"]
        status: to verify
        note: "Indicative prefixes; import the official parts list (CBP CSMS / Federal Register annex)."

  - id: US-232-MHDV
    name: "Section 232 — medium/heavy-duty trucks, buses and parts"
    family: s232
    prefixes: ["9903.74"]
    status: verified
    preferential:
      mode: nonUsContent
      partsExemptOption: usmcaAutoPart
    note: "Trucks 25%, buses 10%; USMCA: 25% on non-U.S. content (CSMS 68559236)."
    lists:
      - id: US-232-MHDV-TRUCKS
        label: "Medium and heavy-duty trucks, tractors and parts"
        rate: 25
        prefixes: ["8701.21", "8701.22", "8701.23", "8701.24", "8701.29", "8704.22", "8704.23", "8704.32", "8704.42", "8704.43", "8704.52"]
        status: to verify
