  NZ: { name: "EU-New Zealand Free Trade Agreement", short: "EU-NZ FTA", url: "https://trade.ec.europa.eu/access-to-markets/en/content/free-trade-agreements" }
  CL: { name: "EU-Chile Interim Trade Agreement", short: "EU-Chile ITA", url: "https://trade.ec.europa.eu/access-to-markets/en/content/free-trade-agreements" }
