<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e1113" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SLSC Tarifs" />
    <title>SLSC TARIFF SIMULATOR</title>
  </head>
  <body>
    <script>
      try { var t = localStorage.getItem('slsc-tariff-theme'); document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : 'system'; } catch (e) { document.documentElement.dataset.theme = 'system'; }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
